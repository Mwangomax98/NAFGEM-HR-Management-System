services:
  postgres:
    image: postgres:16-alpine
    container_name: harmony-hr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: harmony
      POSTGRES_PASSWORD: harmony
      POSTGRES_DB: harmony_hr
    ports:
      - "5432:5432"
    volumes:
      - harmony_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmony -d harmony_hr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  harmony_pg_data:
