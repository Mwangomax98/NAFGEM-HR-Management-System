# Nginx reverse proxy for hr.nafgemtanzania.or.tz
# Place on the server (e.g. /etc/nginx/sites-available/hr.nafgemtanzania.or.tz)
# Then: sudo ln -s .../sites-available/... .../sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d hr.nafgemtanzania.or.tz

server {
    listen 80;
    server_name hr.nafgemtanzania.or.tz;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
